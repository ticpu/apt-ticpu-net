# Which GitHub release assets go into which apt suites.
#
# `signed: true` makes a missing .asc a hard error rather than a warning, so a
# project that has adopted signing cannot silently regress to unsigned uploads.
#
# `manifest: true` means the release carries a manifest.json naming the suite
# for each file. Use it whenever the same package name is rebuilt per distro —
# no filename pattern can tell those apart, because each carries that distro's
# own upstream version.
#
# `version_from_tag: true` asserts each package's version matches the tag. Set it
# wherever the project versions its packages from git, which is everything except
# the podman set: a release job checking out shallow has no tags, derives
# 1.2.3+<sha> instead of 1.2.3, and publishes it without complaint.

- name: bcachefs-storage-driver
  repo: ticpu/bcachefs-storage-driver
  signed: true
  manifest: true

- name: freeswitch-log-parser
  repo: ticpu/freeswitch-log-parser
  signed: true
  version_from_tag: true
  assets:
  - glob: fslog_*.deb
    suites: [bookworm, trixie, noble, resolute, generic]

# v1.4.4 is its first release carrying a .deb; earlier tags shipped only bare
# binaries and would fail the signed check anyway.
- name: fs_cli-rs
  repo: ticpu/fs_cli-rs
  signed: true
  version_from_tag: true
  assets:
  - glob: fs-cli_*.deb
    suites: [bookworm, trixie, noble, resolute, generic]

- name: ticpu-claude-command-hook
  repo: ticpu/ticpu-claude-command-hook
  signed: true
  version_from_tag: true
  assets:
  - glob: ticpu-claude-command-hook_*.deb
    suites: [bookworm, trixie, noble, resolute, generic]

- name: claude-conversation-search-mcp
  repo: ticpu/claude-conversation-search-mcp
  signed: true
  version_from_tag: true
  assets:
  - glob: claude-conversation-search_*.deb
    suites: [bookworm, trixie, noble, resolute, generic]

- name: ccusage-statusline-rs
  repo: ticpu/ccusage-statusline-rs
  signed: true
  version_from_tag: true
  assets:
  - glob: ccusage-statusline-rs_*.deb
    suites: [bookworm, trixie, noble, resolute, generic]
