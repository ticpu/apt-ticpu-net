# /etc/nginx/sites-available/apt on p4, symlinked into sites-enabled.
# Serves the tree publish.sh rsyncs to /srv/http/apt.

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	# Block blacklisted real IPs (fail2ban-managed geo map)
	if ($blocked_ip) {
		return 444;
	}

	include snippets/cloudflare_ssl.conf;
	include snippets/security_headers.conf;
	server_name apt.ticpu.net;
	limit_conn perip 64;

	root /srv/http/apt;
	autoindex on;

	# A pool path names a version, so its bytes never change. The indexes do,
	# and a cached InRelease served against a fresh Packages fails as a hash
	# mismatch that says nothing about caching.
	location /pool/ {
		include snippets/security_headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /dists/ {
		include snippets/security_headers.conf;
		add_header Cache-Control "no-cache";
	}
}
